services:
  # ── NestJS Application ──────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pma-api
    ports:
      - "${SERVER_PORT:-9000}:9000"
    env_file:
      - .env.docker
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pma-network
    healthcheck:
      test: ["CMD","curl", "-f", "http://localhost:9000"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  # ── MySQL Database ──────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: pma-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-personal_medical_assistant_db}
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - pma-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASS:-PASSWORD}"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    command: --default-authentication-plugin=mysql_native_password

  # ── Redis Cache ─────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: pma-redis
    ports:
      - "6380:6379"
    restart: unless-stopped
    networks:
      - pma-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3

# ── Volumes ─────────────────────────────────────
volumes:
  mysql_data:
    driver: local

# ── Networks ────────────────────────────────────
networks:
  pma-network:
    driver: bridge
